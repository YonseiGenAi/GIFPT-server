server {
    listen 80;
    server_name _;

    client_max_body_size 100m;
    sendfile on;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Spring (Swagger, API)
    location /swagger-ui/        { proxy_pass http://spring:8080/swagger-ui/; }
    location /v3/api-docs/       { proxy_pass http://spring:8080/v3/api-docs/; }
    location /api/               { proxy_pass http://spring:8080/api/; }
    location = /healthz          { proxy_pass http://spring:8080/healthz; }
    location /actuator/          { proxy_pass http://spring:8080/actuator/; }

    # Django (Studio)
    location /studio/ {
        proxy_pass http://django:8000/studio/;
        proxy_read_timeout 300s;
    }
}
